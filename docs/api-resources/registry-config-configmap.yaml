# Replace the PEM bundle with your real CA chain (intermediate + root recommended).
# Key name MUST use double-dot before port: registry.example.com..8443
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: openshift-config
data:
  registry.ocp4.example.com..8443: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_INTERMEDIATE_OR_BUNDLE
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_ROOT
    -----END CERTIFICATE-----
